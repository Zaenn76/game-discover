<!doctype html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Game Discover — Platform rekomendasi game digital berbasis AI untuk menemukan game favoritmu.">
  <title>{% block title %}Game Discover{% endblock %}</title>

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Design System -->
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

{% set path = request.url.path %}

{% if user %}
<!-- ╔══════════════════════════════╗
     ║        PREMIUM NAVBAR        ║
     ╚══════════════════════════════╝ -->
<nav class="navbar navbar-expand-md sticky-top" id="mainNav">
  <div class="container">

    <!-- Brand / Logo -->
    <a class="navbar-brand" href="/">
      <span class="brand-icon">🎮</span>
      Game Discover
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#navCollapse"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Items -->
    <div class="collapse navbar-collapse" id="navCollapse">
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {{ 'active' if path == '/' }}" href="/">
            <span>🏠</span> Beranda
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if path == '/library' }}" href="/library">
            <span>📚</span> My Library
          </a>
        </li>
      </ul>

      <!-- Right: Avatar + Username + Logout -->
      <div class="d-flex align-items-center gap-3">
        <div class="navbar-user d-none d-md-flex">
          <div class="nav-avatar" title="{{ user.username }}">
            {{ user.username[0].upper() }}
          </div>
          <span class="d-none d-lg-inline">{{ user.username }}</span>
        </div>
        <a class="btn-logout" href="/logout">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Keluar
        </a>
      </div>
    </div>

  </div>
</nav>
{% endif %}

<!-- Main Content -->
{% block full_page %}
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App JS -->
<script src="/static/js/app.js"></script>

<!-- Navbar scroll effect -->
<script>
  (function () {
    const nav = document.getElementById('mainNav');
    if (!nav) return;
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 20);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>

</body>
</html>
